# Repository-level CLI/env contract for governance tooling.
# owls-docs publishes contract documentation, not an application CLI. The
# command below is the repository-owned validation entrypoint.

[help]
url = "https://github.com/ores-wasm-loaders/owls-docs"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
command_env = "OWLS_DOCS_GOVERNANCE_COMMAND"
unknown_options_env = "OWLS_DOCS_UNKNOWN_OPTIONS"
errors_env = "OWLS_DOCS_PARSE_ERRORS"
allow_unknown = false

[commands.env-contract]
help = "Validate the repository CLI/environment inventory and fail closed on drift."
env = "OWLS_DOCS_ENV_CONTRACT"

